name: NileBase screenshots

on:
  push:
    branches: [nilebase-studio]
    paths:
      - 'apps/studio/**'
      - 'packages/**'
      - 'scripts/screenshots.mjs'
      - '.github/workflows/screenshots.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Studio image (Arabic / RTL)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio/Dockerfile
          target: production
          load: true
          tags: nilebase-studio:ar
          build-args: |
            NEXT_PUBLIC_UI_LOCALE=ar
          cache-from: type=gha,scope=studio-ar
          cache-to: type=gha,mode=max,scope=studio-ar

      - name: Run Studio
        run: |
          docker run -d --name studio -p 3000:3000 nilebase-studio:ar
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3000/ && break
            sleep 3
          done
          docker logs studio | tail -20

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: Take screenshots
        run: |
          cp scripts/screenshots.mjs /tmp/pw/ && cd /tmp/pw
          node screenshots.mjs http://localhost:3000 /tmp/shots

      - name: Publish to the screenshots branch
        run: |
          cd /tmp/shots
          {
            echo "# NileBase screenshots"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo
            for f in $(ls *.png | sort); do
              echo "## $f"
              echo "![$f]($f)"
              echo
            done
          } > README.md
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
